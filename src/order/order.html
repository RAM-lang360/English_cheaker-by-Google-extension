<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="grammar-check">
        <div class="div">
            <div class="overlap">
                <div class="title">
                    <div class="text-wrapper">英文正誤判断システム</div>
                    <div class="text-wrapper-2">Grammar check system</div>
                </div>
                <button type="button" class="back-button" id="back_button">
                    <div class="back-button-text">戻る</div>
                </button>
            </div>

            <div class="order-button-after-1">
                <div class="text-wrapper-5">入力された文</div>
            </div>
            <div class="view">
                <div class="text-wrapper-6" id="input_text"></div>
            </div>
            <div class="order-button-after-2">
                <div class="text-wrapper-5">判断</div>
            </div>
            <div class="view-2">
                <div class="text-wrapper-6" id="judgment_reason"></div>
            </div>
            <div class="order-button-after-3">
                <div class="text-wrapper-5">修正案</div>
            </div>
            <div class="view-3">
                <div class="text-wrapper-6" id="correction_suggestion"></div>
            </div>
        </div>
    </div>
    <script src="order.js"></script>
</body>

</html>
