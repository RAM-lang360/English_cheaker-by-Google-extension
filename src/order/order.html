<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="order-check">
        <div class="title">
            <div class="order-check-title" id="order-check-title">英文正誤判断システム</div>
            <div class="order-check-title-en" id="order-check-title-en">Grammar check system</div>
        </div>
        <button type="button" class="back-button" id="back_button">
            <div class="back-button-text">戻る</div>
        </button>

        <div class="input-content">
            <div class="content-text">入力された文</div>
        </div>
        <div class="result">
            <div class="result-text" id="input_text"></div>
        </div>
        <div class="judgement">
            <div class="content-text">判断</div>
        </div>
        <div class="result">
            <div class="result-text" id="judgment_reason"></div>
        </div>
        <div class="correction_suggestion">
            <div class="content-text">修正案</div>
        </div>
        <div class="result">
            <div class="result-text" id="correction_suggestion"></div>
        </div>
    </div>
    <script src="order.js"></script>
</body>

</html>
