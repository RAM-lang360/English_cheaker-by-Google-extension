<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="API-setting">
        <div class="title">
            <div class="title-text">API設定</div>
            <div class="title-text-en">API setting</div>
        </div>
        <button type="button" class="back_button" id="back_button">
            <div class="back-button-text">戻る</div>
        </button>
        <input type="text" class="input-text" id="api_key" placeholder="API Key"></input>
        <div class="store-result">
            <div class="result-text" id="store_result"></div>
        </div>
        <div class="test-result">
            <div class="result-text" id="test_result"></div>
        </div>


        <div class="store-button">
            <button class="store-button-label">
                <span class="button-text" id="api-setting-store-button">保存</span>
            </button>
        </div>
        <div class="test-button">
            <button class="test-button-label">
                <span class="button-text" id="api-setting-test-button">テスト</span>
            </button>
        </div>
    </div>
    <script src="api_setting.js"></script>
</body>

</html>
