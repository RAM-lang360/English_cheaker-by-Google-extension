<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title class="title">English check</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="popup">
    <div class="div">
      <div class="title">
        <div class="popup-title">英文正誤判断システム</div>
        <div class="popup-title-en">Grammar check system</div>
      </div>
      <button type="button" class="api-setting" id="api_setting">
        <div class="api-setting-text">APIの設定</div>
      </button>
      <button type="button" class="option-setting" id="option_setting">
        <div class="option-setting-text">オプションの選択</div>
      </button>
      <div class="component">
        <div class="input">
          <input type="text" class="request-text" id="request_text" placeholder="文章・単語を入力してください">
          <button type="button" class="send-button" id="send_button" >
            <span class="send-button-text">評価</span>
          </button>
        </div>
        <div class="order">
          <button type="button" class="text-check"id="text_check" >
            <span class="order-text">文法チェック</span>
          </button>
          <button type="button" class="meaning-check" id="meaning_check">
            <span class="order-text">意味の違い</span>
          </button>
          <button type="button" class="spell-check" id="spell_check" >
            <span class="order-text">スペルチェック</span>
          </button>
          
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>

</body>

</html>
